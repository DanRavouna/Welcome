<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Games</title>
<meta name="description" content="A shelf of games. Pick a cartridge to play.">
<meta name="theme-color" content="#E8641E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap">
<style>
:root{--bg:#E8641E;--stripe:#CC4D0F;--cart:#5BB8B2;--cart-dk:#2F7F7C;--cart-lt:#A8E6DF;--win:#0E0E16;--shadow:#6A2406;
--bar:#0F0D12;--bar-edge:#F04AD8;--bar-edge-dk:#8F1F82;--ink:#FFFFFF;--empty:#8F8D93;--empty-dk:#55535B;--empty-lt:#C4C2C8;--empty-win:#2A2830}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg) repeating-linear-gradient(135deg,var(--stripe) 0 26px,transparent 26px 52px);color:var(--ink);
font-family:'Press Start 2P',ui-monospace,monospace;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.shelf{display:grid;grid-template-columns:repeat(10,1fr);gap:20px;width:min(100%,1180px);list-style:none;margin:0;padding:0}
@media(max-width:1100px){.shelf{grid-template-columns:repeat(6,1fr);gap:16px}}
@media(max-width:640px){.shelf{grid-template-columns:repeat(3,1fr);gap:14px}}
.cart{position:relative;display:block;background:var(--cart);border:4px solid var(--cart-dk);padding:7px 7px 0;box-shadow:6px 6px 0 var(--shadow);text-decoration:none;color:inherit;outline:none;transition:transform 60ms steps(2)}
.cart::before{content:"";position:absolute;inset:0;border:3px solid var(--cart-lt);border-right-color:var(--cart-dk);border-bottom-color:var(--cart-dk);pointer-events:none}
.cart .win{display:block;aspect-ratio:1/1;background:var(--win);border:3px solid var(--cart-dk);overflow:hidden}
.cart canvas,.cart img{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.cart .slot{display:block;height:20px;margin:7px -7px 0;background:var(--cart-dk);border-top:4px solid var(--cart-lt);position:relative}
.cart .slot::after{content:"";position:absolute;left:22%;right:22%;top:5px;height:6px;background:var(--win)}
.cart .name{position:absolute;left:-9999px}
a.cart:hover,a.cart:focus-visible,a.cart.sel{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--shadow)}
a.cart:focus-visible,a.cart.sel{outline:4px solid #FFF;outline-offset:3px}
.cart.empty{background:var(--empty);border-color:var(--empty-dk);box-shadow:5px 5px 0 var(--shadow)}
.cart.empty::before{border-color:var(--empty-lt);border-right-color:var(--empty-dk);border-bottom-color:var(--empty-dk)}
.cart.empty .win{background:var(--empty-win);border-color:var(--empty-dk)}
.cart.empty .slot{background:var(--empty-dk);border-top-color:var(--empty-lt)}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bar);border-top:5px solid var(--bar-edge);box-shadow:0 -5px 0 var(--bar-edge-dk);padding-bottom:env(safe-area-inset-bottom,0px);
font-size:clamp(10px,2.1vw,22px);line-height:1;text-transform:uppercase;letter-spacing:.04em}
.bar>div{padding:18px 14px 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:5px solid var(--bar-edge)}
.bar>div:last-child{border-right:0}
.bar .t{flex:3;min-width:0}.bar .y{flex:1;text-align:center;min-width:5ch}.bar .r{flex:2;text-align:center;min-width:0}
@media(max-width:640px){.bar>div{padding:14px 8px 12px}.bar .y{display:none}}
@media(prefers-reduced-motion:reduce){.cart{transition:none}}
</style>
</head>
<body>
<main>
<ul class="shelf" id="shelf" aria-label="Games">
<li><a class="cart" id="g1" href="games/critter-roll/index.html" data-n="1" data-name="Critter Roll" data-year="2026" data-save="critter-roll:v2"><span class="win"><canvas id="art1" width="16" height="16" role="img" aria-label="A cottage at night with one lit window"></canvas></span><span class="slot"></span><span class="name">Critter Roll</span></a></li>
</ul>
</main>
<div class="bar" id="bar" aria-live="polite"><div class="t" id="bar-t">01 Critter Roll</div><div class="y" id="bar-y">2026</div><div class="r" id="bar-r">-No record-</div></div>
<script>
(() => {
  // Pixel art for each cartridge window, drawn from a character map (one char = one pixel) so a label can be edited by hand.
  const ART = {
    1: { pal: { s: '#141A33', '*': '#8C96C8', r: '#4A2F3A', h: '#5A4A66', y: '#7A6230', w: '#FFD86B', W: '#FFF4C2', d: '#2A2133', g: '#243625', G: '#2E4A2E' }, rows: [
      'ssssssssssssssss', 'ss*ssssssssss*ss', 'sssssssss*ssssss', 'sssssssrrsssssss', 'ssssssrrrrssssss', 'sssssrrrrrrsssss', 'ssssrrrrrrrrssss', 'sssrrrrrrrrrrsss',
      'ssshhhhhhhhhhsss', 'ssshhywwyhhdhsss', 'ssshhyWWyhhdhsss', 'ssshhywwyhhdhsss', 'ssshhhhhhhhdhsss', 'ssshhhhhhhhhhsss', 'gggggggggggggggg', 'GgGGgGGGgGGgGGGg'] } };
  function paint(id, art) {
    const c = document.getElementById('art' + id); if (!c) return; const g = c.getContext('2d');
    art.rows.forEach((row, y) => { for (let x = 0; x < row.length; x++) { g.fillStyle = art.pal[row[x]] || '#000'; g.fillRect(x, y, 1, 1); } });
  }
  Object.keys(ART).forEach((k) => paint(k, ART[k]));
  // Empty cartridges fill the shelf up to a round number, so the shelf reads as a collection with room in it.
  const SLOTS = 20, shelf = document.getElementById('shelf'), games = Array.from(shelf.querySelectorAll('a.cart'));
  for (let i = games.length; i < SLOTS; i++) { const li = document.createElement('li'); li.innerHTML = '<span class="cart empty" aria-hidden="true"><span class="win"></span><span class="slot"></span></span>'; shelf.appendChild(li); }
  // The bar names the cartridge under the hand: its number, its name, its year and the record this device holds for it.
  const pad = (n) => (n < 10 ? '0' : '') + n;
  function record(g) {
    try { const s = JSON.parse(localStorage.getItem(g.dataset.save) || 'null'); const k = s && Array.isArray(s.caught) ? s.caught.length : 0; return k ? k + ' kept' : null; } catch (e) { return null; }
  }
  function show(g) {
    document.getElementById('bar-t').textContent = pad(+g.dataset.n) + ' ' + g.dataset.name;
    document.getElementById('bar-y').textContent = g.dataset.year;
    document.getElementById('bar-r').textContent = record(g) || '-No record-';
  }
  let sel = games[0]; if (sel) { sel.classList.add('sel'); show(sel); }
  games.forEach((g) => {
    g.addEventListener('mouseenter', () => show(g)); g.addEventListener('mouseleave', () => show(sel));
    g.addEventListener('focus', () => { if (sel) sel.classList.remove('sel'); sel = g; g.classList.add('sel'); show(g); });
  });
  // Arrow keys walk the shelf; Enter opens the selected cartridge (it is a link, so Enter is native once it has focus).
  const cols = () => getComputedStyle(shelf).gridTemplateColumns.split(' ').length;
  document.addEventListener('keydown', (e) => {
    if (!games.length) return; const i = Math.max(0, games.indexOf(sel)); let j = i;
    if (e.key === 'ArrowRight') j = i + 1; else if (e.key === 'ArrowLeft') j = i - 1; else if (e.key === 'ArrowDown') j = i + cols(); else if (e.key === 'ArrowUp') j = i - cols();
    else if (e.key === 'Enter' && document.activeElement !== sel) { sel.click(); return; } else return;
    j = Math.min(games.length - 1, Math.max(0, j)); e.preventDefault(); games[j].focus();
  });
  window.__shelf = { games: games.length, slots: SLOTS, record: () => document.getElementById('bar-r').textContent };
})();
</script>
<noscript><p style="text-align:center;padding:16px"><a href="games/critter-roll/index.html" style="color:#fff">Play Critter Roll</a></p></noscript>
</body>
</html>
