# Deploys the built game to GitHub Pages from a workflow we control, so a stuck deploy can be retried from the Actions tab
# (Actions > Deploy to GitHub Pages > Run workflow) instead of waiting on GitHub's automatic branch deploy.
# Needs Settings > Pages > Build and deployment > Source set to "GitHub Actions" (a one-time switch by the repository owner).
# games/critter-roll/index.html is still built locally (python3 src/build2.py) and committed, as the standing rules say; this only publishes it with the root index.html (the shelf) and games/.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (the shelf page, the built games and the vendored library only)
        run: |
          mkdir -p site
          cp index.html site/
          cp -r games site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
